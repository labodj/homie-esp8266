name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            scripts/ota_updater/requirements.txt
      - name: Install release tools
        run: |
          python -m pip install --upgrade pip platformio \
            -r docs/requirements.txt \
            -r scripts/ota_updater/requirements.txt
      - name: Validate tag and package metadata
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v[0-9]+[.][0-9]+[.][0-9]+(?:[-+][0-9A-Za-z.-]+)?", tag):
              sys.exit(f"Release tag {tag!r} is not a semantic version tag like v3.2.0")

          library_json = json.loads(pathlib.Path("library.json").read_text(encoding="utf-8"))
          package_version = library_json["version"]
          if tag[1:] != package_version:
              sys.exit(
                  f"Tag {tag!r} does not match library.json version {package_version!r}"
              )
          PY
      - name: Validate package and helpers
        run: |
          python -m json.tool library.json >/dev/null
          python -m py_compile scripts/ota_updater/ota_updater.py
          python scripts/ota_updater/test_ota_updater.py
          mkdocs build --strict
          mkdir -p dist
          pio pkg pack -o dist .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip)
          args=(
            "${GITHUB_REF_NAME}"
            --title "${GITHUB_REF_NAME}"
            --verify-tag
            --generate-notes
            --latest
            --fail-on-no-commits
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" "${assets[@]}"
