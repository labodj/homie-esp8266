name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PLATFORMIO_PACKAGE_OWNER: ${{ vars.PLATFORMIO_PACKAGE_OWNER }}
  PLATFORMIO_PACKAGE_NAME: homie-v5

jobs:
  platformio:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: esp8266-default
            board: nodemcuv2
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
          - name: esp8266-no-config
            board: nodemcuv2
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DHOMIE_CONFIG=0
          - name: esp8266-no-mdns
            board: nodemcuv2
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DHOMIE_MDNS=0
          - name: esp8266-queue-min
            board: nodemcuv2
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DHOMIE_PENDING_MQTT_ACK_QUEUE_SIZE=1 -DHOMIE_PENDING_MQTT_MESSAGE_QUEUE_SIZE=1
          - name: esp8266-queue-large
            board: nodemcuv2
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DHOMIE_PENDING_MQTT_ACK_QUEUE_SIZE=64 -DHOMIE_PENDING_MQTT_MESSAGE_QUEUE_SIZE=32
          - name: esp8266-preallocated-queue
            board: nodemcuv2
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DHOMIE_PENDING_MQTT_MESSAGE_PREALLOCATED=1
          - name: esp8266-homie-v4
            board: nodemcuv2
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DHOMIE_CONVENTION_VERSION=4
          - name: esp8266-homie-v5
            board: nodemcuv2
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DHOMIE_CONVENTION_VERSION=5
          - name: esp8266-littlefs-only
            board: nodemcuv2
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DHOMIE_USE_LITTLEFS=1
          - name: esp8266-littlefs-migration
            board: nodemcuv2
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DHOMIE_USE_LITTLEFS=1 -DHOMIE_MIGRATE_SPIFFS_TO_LITTLEFS=1
          - name: esp8266-esp01-no-config
            board: esp01_1m
            platform: ""
            build_flags: -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DHOMIE_CONFIG=0 -DHOMIE_MDNS=0
          - name: esp32-default
            board: esp32dev
            platform: ""
            build_flags: ""
          - name: esp32-no-config-no-mdns
            board: esp32dev
            platform: ""
            build_flags: -DHOMIE_CONFIG=0 -DHOMIE_MDNS=0
          - name: esp32-homie-v4
            board: esp32dev
            platform: ""
            build_flags: -DHOMIE_CONVENTION_VERSION=4
          - name: esp32-homie-v5
            board: esp32dev
            platform: ""
            build_flags: -DHOMIE_CONVENTION_VERSION=5
          - name: esp32-preallocated-queue
            board: esp32dev
            platform: ""
            build_flags: -DHOMIE_PENDING_MQTT_MESSAGE_PREALLOCATED=1
          - name: esp32-littlefs-only
            board: esp32dev
            platform: ""
            build_flags: -DHOMIE_USE_LITTLEFS=1
          - name: esp32-littlefs-migration
            board: esp32dev
            platform: ""
            build_flags: -DHOMIE_USE_LITTLEFS=1 -DHOMIE_MIGRATE_SPIFFS_TO_LITTLEFS=1
          - name: esp32-pioarduino
            board: esp32dev
            platform: https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
            build_flags: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build Ping example
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ matrix.build_flags }}
        run: |
          args=(--lib=. --board "${{ matrix.board }}" -O "lib_compat_mode=strict")
          if [ -n "${{ matrix.platform }}" ]; then
            args+=(-O "platform=${{ matrix.platform }}")
          fi
          pio ci "${args[@]}" examples/Ping/src

  release:
    needs: platformio
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            scripts/ota_updater/requirements-dev.txt
      - name: Install release tools
        run: |
          python -m pip install --upgrade pip platformio \
            -r docs/requirements.txt \
            -r scripts/ota_updater/requirements-dev.txt
      - name: Validate tag and package metadata
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v[0-9]+[.][0-9]+[.][0-9]+(?:[-+][0-9A-Za-z.-]+)?", tag):
              sys.exit(f"Release tag {tag!r} is not a semantic version tag like v1.2.3")

          library_json = json.loads(pathlib.Path("library.json").read_text(encoding="utf-8"))
          package_version = library_json["version"]
          if tag[1:] != package_version:
              sys.exit(
                  f"Tag {tag!r} does not match library.json version {package_version!r}"
              )
          PY
      - name: Validate package and helpers
        run: |
          python -m json.tool library.json >/dev/null
          make python-check
          mkdocs build --strict
          package_version="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("library.json").read_text(encoding="utf-8"))["version"])')"
          mkdir -p dist
          pio pkg pack -o "dist/homie-v5-${package_version}.tar.gz" .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip)

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            args=(
              "${GITHUB_REF_NAME}"
              --title "${GITHUB_REF_NAME}"
              --verify-tag
              --generate-notes
              --latest
              --fail-on-no-commits
            )
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}" "${assets[@]}"
          fi
      - name: Publish to PlatformIO Registry
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: |
          shopt -s nullglob
          packages=(dist/*.tar.gz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one PlatformIO package archive in dist/"
            exit 1
          fi

          account_username="$(pio account show --json-output | python -c 'import json, sys; print(json.load(sys.stdin)["profile"]["username"])')"
          package_owner="${PLATFORMIO_PACKAGE_OWNER:-${account_username}}"
          package_version="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("library.json").read_text(encoding="utf-8"))["version"])')"
          package_ref="${package_owner}/${PLATFORMIO_PACKAGE_NAME}@${package_version}"

          if pio pkg show "${package_ref}" >/dev/null 2>&1; then
            echo "PlatformIO package ${package_ref} already exists; skipping publish."
            exit 0
          fi

          if [ -z "${PLATFORMIO_AUTH_TOKEN}" ]; then
            echo "::error::Set the PLATFORMIO_AUTH_TOKEN repository secret before publishing ${package_ref}."
            exit 1
          fi

          publish_args=("${packages[0]}" --type library --no-interactive)
          if [ -n "${PLATFORMIO_PACKAGE_OWNER}" ]; then
            publish_args+=(--owner "${PLATFORMIO_PACKAGE_OWNER}")
          fi

          pio pkg publish "${publish_args[@]}"
